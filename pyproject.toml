[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "keylogix"
version = "0.1.0"
description = "Controlled laboratory for Windows low-level input-capture research"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Research / laboratory use only" }

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
keylogix = "keylogix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
